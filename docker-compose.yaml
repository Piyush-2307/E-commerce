services:
  postgres:
    image: postgres:17
    container_name: ecom-app-postgres
    environment:
      POSTGRES_DB: ecommerce-application
      POSTGRES_USER: E-com
      POSTGRES_PASSWORD: E-com
    ports:
      - "5432:5432"
    volumes:
      - ecom-app-postgres_data:/var/lib/postgresql/data

volumes:
  ecom-app-postgres_data:
